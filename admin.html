<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gestion des stocks — Les Bouilles à Malice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; background: #fafafa; }
    input[type="password"], input[type="number"] { padding: 0.45rem 0.6rem; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 0.45rem 0.8rem; border: 0; border-radius: 6px; cursor: pointer; background: #222; color: #fff; }
    button.secondary { background: #666; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #e5e5e5; }
    .badge { font-size: 0.78rem; padding: 0.15rem 0.45rem; border-radius: 4px; background: #e6f0ff; color: #16499a; }
    .muted { color: #666; font-size: 0.9rem; }
    #message { margin-top: 0.75rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Gestion des stocks</h1>
  <p class="muted">Remise en stock directe dans Netlify Blobs ou suppression de la surcharge pour revenir au stock de <code>produits.js</code>.</p>

  <div class="box">
    <label for="token-input"><strong>Clé d'accès admin :</strong></label><br /><br />
    <input type="password" id="token-input" placeholder="ADMIN_STOCK_TOKEN" style="min-width: 260px;" />
    <button id="btn-charger" type="button">Charger les stocks</button>
    <button id="btn-effacer-token" type="button" class="secondary">Oublier la clé</button>
    <div id="message"></div>
  </div>

  <div id="zone-articles" style="display: none;">
    <table>
      <thead>
        <tr>
          <th>Article / Variante</th>
          <th>Clé Blobs</th>
          <th>Stock catalogue</th>
          <th>Stock actuel</th>
          <th>Nouveau stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="liste-stocks"></tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>
